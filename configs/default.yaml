dataset:
  name: cifar10
  root: ./data
  download: true
  num_workers: 2
  validation_fraction: 0.1

model:
  num_classes: 10
  dropout: 0.2
  hidden_channels: [32, 64]

training:
  seed: 42
  device: auto
  epochs: 5
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1e-4
  optimizer: adam

search:
  random_trials: 5
  population_size: 8
  generations: 4
  mutation_rate: 0.2
  crossover_rate: 0.8
  clean_weight: 0.5
  corruption_weight: 0.5

corruption:
  types: [gaussian_noise, gaussian_blur, brightness, contrast]
  severities: [1, 2, 3, 4, 5]
  validation_types: [gaussian_noise, brightness]
  validation_severities: [1, 3]

logging:
  experiment_name: evolutionary_robust_ml
  results_dir: ./results
  checkpoints_dir: ./checkpoints
  plots_dir: ./plots

paths:
  output_dir: .
